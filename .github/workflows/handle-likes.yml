name: Handle Summarize Button Taps

on:
  repository_dispatch:
    types: [summarize]   # fired instantly by our Cloudflare Worker the moment a button is tapped
  workflow_dispatch:        # lets us trigger it manually from GitHub's website, for testing

permissions:
  contents: write   # needed so the workflow can save its progress back to the repo

jobs:
  handle-likes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install required packages
        run: pip install -r requirements.txt

      - name: Process the "Summarize" button tap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHORT_ID: ${{ github.event.client_payload.short_id }}
          CALLBACK_QUERY_ID: ${{ github.event.client_payload.callback_query_id }}
          REPLY_CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: python handle_likes.py

      - name: Save updated state files back to the repository
        run: |
          git config user.name "news-tracker-bot"
          git config user.email "actions@github.com"
          git add pending_articles.json
          git diff --cached --quiet || git commit -m "Update pending articles"
          git pull --rebase
          git push
