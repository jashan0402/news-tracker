name: Handle Summarize Button Taps

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # lets us trigger it manually from GitHub's website

permissions:
  contents: write   # needed so the workflow can save its progress back to the repo

jobs:
  handle-likes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required packages
        run: pip install -r requirements.txt

      - name: Check for and process "Summarize" button taps
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python handle_likes.py

      - name: Save updated state files back to the repository
        run: |
          git config user.name "news-tracker-bot"
          git config user.email "actions@github.com"
          git add telegram_offset.json pending_articles.json
          git diff --cached --quiet || git commit -m "Update Telegram offset"
          git pull --rebase
          git push
