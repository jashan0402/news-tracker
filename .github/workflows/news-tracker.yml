name: News Tracker

on:
  schedule:
    # Every 3 hours during 6AM-1AM IST (IST = UTC+5:30), quiet 1AM-6AM IST.
    # IST 6,9,12,15,18,21,24(midnight) -> UTC 0:30,3:30,6:30,9:30,12:30,15:30,18:30
    - cron: "30 0,3,6,9,12,15,18 * * *"
  workflow_dispatch:        # lets us trigger it manually from GitHub's website

permissions:
  contents: write   # needed so the workflow can save its updated "seen articles" file back to the repo

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install required packages
        run: pip install -r requirements.txt

      - name: Run the news tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_fetcher.py

      - name: Save updated state files back to the repository
        run: |
          git config user.name "news-tracker-bot"
          git config user.email "actions@github.com"
          git add seen_articles.json pending_articles.json recent_topics.json
          git diff --cached --quiet || git commit -m "Update seen/pending articles"
          git pull --rebase
          git push
